    <script>
        const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // --- 動態題庫生成器 ---
        const levels = {
            1: { 
                icon: "⚖️", name: "和差與給予", type: "standard",
                factories: [
                    () => {
                        const sum = rand(100, 500) * 2; const diff = rand(10, 80) * 2;
                        return { q: `兩人共有 ${sum} 點遊戲點數，小喵比小汪少 ${diff} 點，請問小喵有幾點？`, type: "input", ans: (sum-diff)/2 };
                    },
                    () => {
                        const sum = rand(500, 1500) * 2; const diff = rand(50, 300) * 2;
                        return { q: `【進階】哥哥和妹妹的存款共有 ${sum} 元，哥哥比妹妹多 ${diff} 元。請問哥哥有多少元？`, type: "input", ans: (sum+diff)/2 };
                    },
                    () => {
                        const a = rand(300, 800); const b = rand(100, 250); const diff = a-b; const evenDiff = diff % 2 === 0 ? diff : diff+1;
                        const finalA = b + evenDiff;
                        return { q: `小傑有 ${finalA} 顆彈珠，秀文有 ${b} 顆，小傑要給秀文幾顆，兩人的彈珠才會一樣多？`, type: "choice", options: [evenDiff/2, evenDiff, (finalA+b)/2], ans: 0 };
                    },
                    () => {
                        const a = rand(800, 1500); const give = rand(100, 300);
                        return { q: `甲水塔有 ${a} 公升的水，如果從乙水塔抽 ${give} 公升到甲水塔後，兩個水塔的水就一樣多。乙水塔原來有多少公升？`, type: "input", ans: a + give*2 };
                    },
                    () => {
                        const sum = rand(300, 600)*2; const diff = rand(50, 150)*2; const small = (sum-diff)/2;
                        return { q: `【是非題】大、小兩數的和是 ${sum}，兩數的差是 ${diff}，那麼小數是 ${small}。`, type: "choice", options: ["✅ 是 (True)", "❌ 否 (False)"], ans: 0 };
                    },
                    () => {
                        const sum = rand(100, 300)*2; const diff = rand(20, 80)*2;
                        return { q: `老師買了草莓和葡萄兩種果凍共 ${sum} 個，草莓比葡萄多 ${diff} 個。請問葡萄果凍有幾個？`, type: "input", ans: (sum-diff)/2 };
                    },
                    () => {
                        const a = rand(1500, 3000); const give = rand(200, 500);
                        return { q: `A銀行的存款有 ${a} 元，從B銀行匯出 ${give} 元到A銀行後，兩家銀行的存款一樣多。請問B銀行原本有多少元？`, type: "input", ans: a + give*2 };
                    }
                ]
            },
            2: { 
                icon: "📏", name: "年齡與差不變", type: "standard",
                factories: [
                    () => {
                        const a = rand(30, 55); const b = rand(8, 20); const y = rand(10, 25);
                        return { q: `今年媽媽 ${a} 歲，弟弟 ${b} 歲，${y} 年後，兩人相差幾歲？`, type: "input", ans: a-b };
                    },
                    () => {

        function showScreen(id) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));

        function goHome() { window.location.href = "https://jessiemath0703-chu.github.io/website2/"; }

            renderLeaderboard();

        function setDifficulty(seconds, name) {
            state.difficultyTime = seconds;
            state.difficultyName = name;
            
            [90, 60, 45].forEach(t => {
                const btn = document.getElementById(`diff-${t}`);
                if(t === seconds) {
                    btn.className = `flex-1 text-white font-bold py-3 rounded-lg shadow-md transition border-2 ${t===90?'bg-green-500 border-green-600':t===60?'bg-blue-500 border-blue-600':'bg-red-500 border-red-600'}`;
                } else {
                    btn.className = `flex-1 bg-gray-100/90 hover:bg-gray-200 text-gray-600 font-bold py-3 rounded-lg transition border-2 border-transparent`;
                }
            });
        }

        function selectLevel(lvl) {
            state.level = lvl;
            restartGame();
        }

        function restartGame() {
            state.score = 0;
            state.timer = state.difficultyTime;
            state.combo = 0;
            state.isPaused = false;
            state.history = [];
            state.questionPool = []; 
            state.investigationStep = 0;
            state.currentStepData = null;
            state.isAnswering = false;

            clearInterval(state.interval);
            document.getElementById('modal-pause').classList.add('hidden');
            document.getElementById('jessie-mascot').classList.add('translate-y-[150%]', 'opacity-0');

            showScreen('game');
            updateHUD();
            nextQuestion();

            state.interval = setInterval(() => {
                if(!state.isPaused) {
                    state.timer--;
                    updateHUD();
                    if(state.timer <= 0) endGame();
                }
            }, 1000);
        }

        function pauseGame() { state.isPaused = true; document.getElementById('modal-pause').classList.remove('hidden'); }
        function resumeGame() { state.isPaused = false; document.getElementById('modal-pause').classList.add('hidden'); }

        function quitGame() {
            clearInterval(state.interval);
            showScreen('select');
            renderLeaderboard();
        }

        function updateHUD() {
            document.getElementById('game-timer').innerText = state.timer;
            document.getElementById('game-score').innerText = state.score;

            const comboEl = document.getElementById('combo-display');
            if(state.combo >= 2) {
                comboEl.innerText = `Combo x${state.combo} 🔥`;
                comboEl.classList.add('show');
            } else {
                comboEl.classList.remove('show');
            }
        }

            const msgs = isCorrect ? correctMsgs : wrongMsgs;

            bubble.className = `bg-white text-gray-800 text-sm md:text-base font-bold py-2 px-4 rounded-2xl rounded-bl-none shadow-xl border-2 ${isCorrect ? 'border-green-400' : 'border-orange-400'} max-w-[150px] md:max-w-[200px] mb-8`;
            
            mascot.classList.remove('translate-y-[150%]', 'opacity-0');

            if(jessieTimeout) clearTimeout(jessieTimeout);
            jessieTimeout = setTimeout(() => {
                mascot.classList.add('translate-y-[150%]', 'opacity-0');

        function nextQuestion() {
            state.isAnswering = false;
            const config = levels[state.level];
            const qArea = document.getElementById('question-content');
            const cArea = document.getElementById('controls-area');
            const iconArea = document.getElementById('context-illustration');
            const gameArea = document.getElementById('question-area');

            gameArea.classList.remove('bg-green-500/20', 'bg-red-500/20');
            iconArea.innerText = config.icon;

            if(!state.questionPool || state.questionPool.length === 0) {
                state.questionPool = shuffle([...config.factories]);
            }

            if(config.type === 'investigation') {
                if(state.investigationStep === 0) {
                    state.currentStepData = state.questionPool.pop()();
                }
                renderInvestigation(state.currentStepData, qArea, cArea);
                return;
            }

            const qData = state.questionPool.pop()();
            state.currentQ = qData;

            qArea.innerHTML = `<h3 class="text-3xl font-extrabold mb-4 text-gray-800 drop-shadow-md">${qData.q}</h3>`;
            cArea.innerHTML = '';

            if(qData.type === 'choice') {
                qData.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = "opt-btn bg-white/90 backdrop-blur-sm hover:bg-blue-100 text-blue-800 font-bold py-4 px-6 rounded-xl transition text-lg w-full border-2 border-transparent shadow-md";
                    btn.innerText = opt;
                    btn.onclick = () => handleChoiceAnswer(idx, qData.ans, btn, qData);
                    cArea.appendChild(btn);
                });
            } else if(qData.type === 'input') {
                cArea.innerHTML = `
                    <div class="col-span-1 md:col-span-2 flex gap-2">
                        <input type="number" id="ans-input" class="flex-grow border-2 border-gray-300 rounded-lg px-4 py-3 text-2xl text-center focus:outline-none focus:border-blue-500 bg-white/90 backdrop-blur-sm" placeholder="輸入數字">

                    </div>
                    <div id="input-feedback" class="col-span-1 md:col-span-2 text-center text-xl font-bold mt-2 hidden drop-shadow-md bg-white/80 rounded-lg py-1"></div>
                `;
                
                const submit = () => {
                    if(state.isAnswering) return;
                    const val = parseInt(document.getElementById('ans-input').value);
                    if(isNaN(val)) return;
                    handleInputAnswer(val, qData.ans, qData);
                };
                document.getElementById('submit-btn').onclick = submit;
                document.getElementById('ans-input').onkeypress = (e) => { if(e.key === 'Enter') submit(); };
                
                setTimeout(() => document.getElementById('ans-input').focus(), 50);
            }
        }

        function renderInvestigation(data, qArea, cArea) {
            const unit = data.unit;
            const steps = [
                {
                    text: `案件：${data.story}<br>👉 第一步：先假設全部都是「${data.nameA}」！`,
                    q: `若是 ${data.totalHead} 個${data.nameA}，共有多少${unit}？`,
                    ans: data.totalHead * data.legA
                },
                {
                    text: `假設全是${data.nameA}，會有 ${data.totalHead * data.legA} ${unit}。<br>但現場實際有 ${data.totalLeg} ${unit}。<br>👉 第二步：差距是多少？`,
                    q: `總差距： ${data.totalLeg} 與 ${data.totalHead * data.legA} 相差 = ?`,
                    ans: Math.abs(data.totalLeg - (data.totalHead * data.legA))
                },
                {
                    text: `總差距是 ${Math.abs(data.totalLeg - (data.totalHead * data.legA))}。<br>👉 第三步：如果把一個${data.nameA}換成${data.nameB}，${unit}會差多少？`,
                    q: `單個差距：${data.nameB}(${data.legB}) 與 ${data.nameA}(${data.legA}) 差多少？`,
                    ans: Math.abs(data.legB - data.legA)
                },
                {
                    text: `總差距 ÷ 單個差距 = 換掉的數量。<br>👉 第四步：所以有幾個${data.nameB}？`,
                    q: `答案是？`,
                    ans: Math.abs(data.totalLeg - (data.totalHead * data.legA)) / Math.abs(data.legB - data.legA)
                }
            ];

            const current = steps[state.investigationStep];
            state.currentQ = current; 

            qArea.innerHTML = `
                <div class="text-left w-full">
                    <div class="bg-yellow-100/90 backdrop-blur-sm p-3 rounded-lg text-sm text-gray-700 font-bold mb-3 shadow-sm border border-yellow-200">🕵️ ${data.story}</div>

                    <div class="text-center text-2xl font-extrabold text-blue-800 mt-4 drop-shadow-md">${current.q}</div>

            cArea.innerHTML = `

            document.getElementById('inv-btn').onclick = submit;
            document.getElementById('inv-input').onkeypress = (e) => { if(e.key === 'Enter') submit(); };
            setTimeout(() => document.getElementById('inv-input').focus(), 50);
        }

        function recordHistory(qText, uAns, cAns, isCorrect) {
            state.history.push({ q: qText, userAns: uAns, correctAns: cAns, isCorrect: isCorrect });
        }

        function handleChoiceAnswer(idx, correctIdx, btnElement, qData) {
            state.isAnswering = true;
            const btns = document.querySelectorAll('.opt-btn');
            btns.forEach(b => b.disabled = true);

            const isCorrect = (idx === correctIdx);
            recordHistory(qData.q, qData.options[idx], qData.options[correctIdx], isCorrect);
            
            showJessieMessage(isCorrect); 

            if (isCorrect) {
                btnElement.classList.add('btn-correct');
                document.getElementById('question-area').classList.add('bg-green-500/20');
                state.combo++;
                state.score += (100 + state.combo * 10);
            } else {
                btnElement.classList.add('btn-wrong');
                btns[correctIdx].classList.add('btn-correct');
                document.getElementById('question-area').classList.add('bg-red-500/20');
                state.combo = 0;
            }
            updateHUD();
            setTimeout(nextQuestion, 1500); 
        }

        function handleInputAnswer(val, correctAns, qData) {
            state.isAnswering = true;
            document.getElementById('ans-input').disabled = true;
            document.getElementById('submit-btn').disabled = true;
            
            const isCorrect = (val === correctAns);
            recordHistory(qData.q, val, correctAns, isCorrect);
            
            showJessieMessage(isCorrect); 
            
            const fb = document.getElementById('input-feedback');
            fb.classList.remove('hidden');

            if (isCorrect) {
                document.getElementById('ans-input').classList.add('border-green-500', 'bg-green-100/90', 'text-green-800');

                state.score += (100 + state.combo * 10);

                state.combo = 0;
            }
            updateHUD();
            setTimeout(nextQuestion, 1800); 
        }

            fb.classList.remove('hidden');

            if(isCorrect) {
                document.getElementById('inv-input').classList.add('border-green-500', 'bg-green-100/90');
                document.getElementById('question-area').classList.add('bg-green-500/20');
                fb.innerHTML = `✅ 正確！前往下一步`; fb.classList.add('text-green-600');
                state.investigationStep++;
                state.score += 30;
                state.combo++;
                updateHUD();

                setTimeout(() => {
                    if(state.investigationStep >= 4) {
                        state.score += 50; 
                        state.investigationStep = 0;
                        nextQuestion(); 
                    } else {
                        state.isAnswering = false;
                        renderInvestigation(fullData, document.getElementById('question-content'), document.getElementById('controls-area'));
                        document.getElementById('question-area').classList.remove('bg-green-500/20');
                    }
                }, 1500);

            } else {
                document.getElementById('inv-input').classList.add('border-red-500', 'bg-red-100/90');
                document.getElementById('question-area').classList.add('bg-red-500/20');
                fb.innerHTML = `❌ 算錯囉！正確是 <span class="text-blue-700">${correctAns}</span>`; fb.classList.add('text-red-600');
                state.combo = 0;
                updateHUD();

                setTimeout(() => {
                    state.investigationStep++;
                    if(state.investigationStep >= 4) {
                        state.investigationStep = 0;
                        nextQuestion();
                    } else {
                        state.isAnswering = false;
                        renderInvestigation(fullData, document.getElementById('question-content'), document.getElementById('controls-area'));
                        document.getElementById('question-area').classList.remove('bg-red-500/20');
                    }
                }, 2000);
            }
        }

        function endGame() {
            clearInterval(state.interval);
            showScreen('result');
            document.getElementById('result-score').innerText = state.score;

            const targetScore = state.difficultyTime === 90 ? 800 : (state.difficultyTime === 60 ? 600 : 500);
            let stars = 1;
            if(state.score >= targetScore) stars = 2;
            if(state.score >= targetScore * 1.5) stars = 3;

            const starContainer = document.getElementById('result-stars');
            starContainer.innerHTML = '';
            for(let i=0; i<3; i++) {
                const s = document.createElement('i');
                s.className = `fa-solid fa-star star ${i < stars ? 'filled' : ''}`;
                starContainer.appendChild(s);
            }

            saveScore();
            buildReviewList();
        }

        function saveScore() {
            const key = "jessie_math_lb_v4"; 
            let lb = JSON.parse(localStorage.getItem(key) || "[]");
            
            const now = new Date();
            const pad = (n) => n.toString().padStart(2, '0');
            const datetimeString = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

            const totalAnswered = state.history.length;

            lb.push({ 
                name: state.name, 
                score: state.score, 
                level: levels[state.level].name, 
                mode: state.difficultyName,
                time: state.difficultyTime,
                datetime: datetimeString,
                totalAnswered: totalAnswered
            });
            lb.sort((a,b) => b.score - a.score);
            localStorage.setItem(key, JSON.stringify(lb.slice(0, 10))); 
        }

        function renderLeaderboard() {
            const key = "jessie_math_lb_v4";
            let lb = JSON.parse(localStorage.getItem(key) || "[]");

            const list = document.getElementById('select-screen-lb-list');
            if(lb.length === 0) {
                list.innerHTML = `<div class="col-span-full text-gray-500 text-center py-6 font-bold">目前尚無英雄紀錄，快來搶下第一名！</div>`;
                return;
            }

            const getMedal = (index) => {
                if(index === 0) return '🥇';
                if(index === 1) return '🥈';
                if(index === 2) return '🥉';
                return '🎖️';
            };

            list.innerHTML = lb.map((p, i) => `
                <div class="flex justify-between items-center p-3 border rounded-lg bg-white/80 hover:bg-orange-50 transition border-gray-200 shadow-sm">
                    <div class="flex items-center gap-3">
                        <span class="text-2xl w-8 text-center">${getMedal(i)}</span>
                        <div>
                            <div class="font-bold text-gray-800">${p.name}</div>
                            <div class="text-xs text-gray-500">${p.level} • ${p.mode} • ${p.datetime}</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="font-black text-orange-500 text-lg">${p.score} 分</div>
                        <div class="text-xs text-gray-500 font-bold">${p.totalAnswered} 題</div>
                    </div>
                </div>
            `).join('');
        }

        function buildReviewList() {
            const list = document.getElementById('review-list');
            const totalQuestions = state.history.length;
            
            if(totalQuestions === 0) {
                list.innerHTML = '<div class="text-center text-gray-500 py-4">沒有答題紀錄。</div>';
                return;
            }

            const correctCount = state.history.filter(h => h.isCorrect).length;
            const wrongCount = totalQuestions - correctCount;

            const summaryHTML = `
                <div class="flex justify-around items-center bg-gray-50 p-4 rounded-xl mb-4 border border-gray-200 shadow-sm shrink-0">
                    <div class="text-center">
                        <div class="text-xs text-gray-500 font-bold">此次總分</div>
                        <div class="text-xl md:text-2xl font-black text-orange-500">${state.score}</div>
                    </div>
                    <div class="w-px h-10 bg-gray-300"></div>
                    <div class="text-center">
                        <div class="text-xs text-gray-500 font-bold">答對/總數</div>
                        <div class="text-xl md:text-2xl font-black text-green-600">${correctCount} <span class="text-sm md:text-base text-gray-400">/ ${totalQuestions}</span></div>
                    </div>
                    <div class="w-px h-10 bg-gray-300"></div>
                    <div class="text-center">
                        <div class="text-xs text-gray-500 font-bold">答錯/總數</div>
                        <div class="text-xl md:text-2xl font-black text-red-600">${wrongCount} <span class="text-sm md:text-base text-gray-400">/ ${totalQuestions}</span></div>
                    </div>
                </div>
            `;

            const itemsHTML = state.history.map((h, i) => `
                <div class="p-4 rounded-xl border-l-4 ${h.isCorrect ? 'border-green-500 bg-green-50' : 'border-red-500 bg-red-50'}">
                    <div class="font-bold text-gray-800 mb-2 text-sm"><span class="text-gray-500 mr-1">Q${i+1}.</span> ${h.q}</div>
                    <div class="flex flex-col sm:flex-row gap-2 text-sm">
                        <div class="${h.isCorrect ? 'text-green-700' : 'text-red-700'} font-semibold">你的答案：${h.userAns} ${h.isCorrect ? '✅' : '❌'}</div>
                        ${!h.isCorrect ? `<div class="text-blue-700 font-semibold sm:ml-4">正確答案：${h.correctAns}</div>` : ''}
                    </div>
                </div>
            `).join('');

            list.innerHTML = summaryHTML + itemsHTML;
        }
    </script>
</body>
</html>
