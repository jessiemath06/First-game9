    <script>
        const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // --- 動態改編題庫生成器 (依據提供的PDF重新設計) ---
        const levels = {
            1: { 
                icon: "⚖️", name: "和差與給予", type: "standard",
                factories: [
                    () => {
                        const sum = rand(20, 40) * 2; const diff = rand(2, 6) * 2;
                        return { q: `兩人共有 ${sum} 點遊戲點數，小喵比小汪少 ${diff} 點，請問小喵有幾點？`, type: "input", ans: (sum-diff)/2 };
                    },
                    () => {
                        const a = rand(60, 120); const b = rand(20, 50); const diff = a-b; const evenDiff = diff % 2 === 0 ? diff : diff+1;
                        const finalA = b + evenDiff;
                        return { q: `小傑有 ${finalA} 顆彈珠，秀文有 ${b} 顆，小傑要給秀文幾顆，兩人的彈珠才會一樣多？`, type: "choice", options: [evenDiff/2, evenDiff, (finalA+b)/2], ans: 0 };
                    },
                    () => {
                        const a = rand(200, 400); const give = rand(20, 50);
                        return { q: `甲杯有 ${a} 毫升的水，從乙杯倒 ${give} 毫升到甲杯後，兩杯水就一樣多。乙杯原來有多少毫升？`, type: "input", ans: a + give*2 };
                    },
                    () => {
                        const sum = rand(100, 150)*2; const diff = rand(20, 40)*2; const small = (sum-diff)/2;
                        return { q: `【是非題】大、小兩數的和是 ${sum}，兩數的差是 ${diff}，那麼小數是 ${small}。`, type: "choice", options: ["✅ 是 (True)", "❌ 否 (False)"], ans: 0 };
                    },
                    () => {
                        const sum = rand(40, 60)*2; const diff = rand(5, 15)*2;
                        return { q: `老師買了草莓和葡萄兩種果凍共 ${sum} 個，草莓比葡萄多 ${diff} 個。請問葡萄果凍有幾個？`, type: "input", ans: (sum-diff)/2 };
                    }
                ]
            },
            2: { 
                icon: "📏", name: "年齡與差不變", type: "standard",
                factories: [
                    () => {
                        const a = rand(30, 45); const b = rand(8, 15); const y = rand(5, 12);
                        return { q: `今年媽媽 ${a} 歲，弟弟 ${b} 歲，${y} 年後，兩人相差幾歲？`, type: "input", ans: a-b };
                    },
                    () => {
                        const diff = rand(4, 9);
                        return { q: `【是非題】爸爸和媽媽今年相差 ${diff} 歲，明年他們會相差 ${diff+1} 歲。`, type: "choice", options: ["✅ 是 (True)", "❌ 否 (False)"], ans: 1 };
                    },
                    () => {
                        const diff = rand(20, 30);
                        return { q: `今年媽媽的年齡是妹妹的2倍，兩人相差 ${diff} 歲。10年後，兩人相差幾歲？`, type: "choice", options: [diff, diff+10, diff-10], ans: 0 };
                    },
                    () => {
                        const b = rand(8, 12); const diff = rand(25, 40); const target = rand(50, 70);
                        return { q: `舅舅今年 ${b+diff} 歲，可容今年 ${b} 歲。當舅舅 ${target} 歲時，可容幾歲？`, type: "input", ans: target - diff };
                    },
                    () => {
                        const diff = rand(3, 8); const up = rand(4, 10);
                        return { q: `兩人爬樓梯，小明目前比小華高 ${diff} 階。如果兩人都再往上爬 ${up} 階，他們相差幾階？`, type: "input", ans: diff };
                    }
                ]
            },
            3: { 
                icon: "🔍", name: "幾何與等量轉換", type: "standard",
                factories: [
                    () => {
                        return { q: `【是非題】在一個直角三角形中，除了90度的直角外，另外兩個內角的和也是90度。`, type: "choice", options: ["✅ 是 (True)", "❌ 否 (False)"], ans: 0 };
                    },
                    () => {
                        return { q: `梯形的四個內角和是幾度？`, type: "choice", options: ["180度", "360度", "540度"], ans: 1 };
                    },
                    () => {
                        const b = rand(150, 300); const diff = rand(100, 250);
                        return { q: `A數減去 ${diff} 後，就會和B數相等。如果B數是 ${b}，A數是多少？`, type: "input", ans: b + diff };
                    },
                    () => {
                        const a = rand(150, 250)*2; const b = rand(100, 140)*2;
                        return { q: `甲碗有 ${a} 公克白飯，乙碗有 ${b} 公克。要從甲碗倒多少公克給乙碗，兩碗才會一樣多？`, type: "input", ans: (a-b)/2 };
                    },
                    () => {
                        const total = rand(60, 100); const sold = rand(30, 50);
                        return { q: `張阿姨每天準備 ${total} 顆飯糰，上午已經賣出 ${sold} 顆，還剩下幾個？`, type: "input", ans: total - sold };
                    }
                ]
            },
            4: { 
                icon: "🧱", name: "倍數與單價應用", type: "standard",
                factories: [
                    () => {
                        const sum = rand(150, 250)*2; const diff = rand(30, 60)*2;
                        return { q: `買火鍋和咖啡共花 ${sum} 元，火鍋比咖啡貴 ${diff} 元，請問咖啡是幾元？`, type: "input", ans: (sum-diff)/2 };
                    },
                    () => {
                        const p1 = 12; const p2 = 5;
                        return { q: `奕帆買了 ${p1}元 和 ${p2}元 郵票。每減少 1 張 ${p1}元郵票，改買 1 張 ${p2}元郵票，總價會少幾元？`, type: "input", ans: p1-p2 };
                    },
                    () => {
                        const p = rand(100, 200)*2; const diff = rand(10, 20);
                        return { q: `游泳池的周長是 ${p} 公尺，長比寬多 ${diff} 公尺。游泳池的「長與寬的和」是多少公尺？`, type: "choice", options: [p/2, p/4, p-diff], ans: 0 };
                    },
                    () => {
                        const p1 = 45; const p2 = 35; const t = rand(15, 25);
                        return { q: `【是非題】牛奶一瓶 ${p1} 元，果汁一瓶 ${p2} 元。如果買了 ${t} 瓶全部都是牛奶，總價是 ${p1*t} 元。`, type: "choice", options: ["✅ 是 (True)", "❌ 否 (False)"], ans: 0 };
                    },
                    () => {
                        const a = rand(10, 20); const b = rand(2, 6);
                        return { q: `回收 1 公斤紙類可換 4 張貼紙。班上回收了 ${a} 公斤紙類和 ${b} 公斤塑膠，光是紙類就可以換幾張貼紙？`, type: "input", ans: a*4 };
                    }
                ]
            },
            5: { 
                icon: "🐇", name: "經典雞兔", type: "investigation",
                factories: [
                    () => {
                        const totalHead = rand(12, 20); const countB = rand(4, totalHead - 4); const countA = totalHead - countB;
                        return { story: `農場有兔子和雞共 ${totalHead} 隻，算一算共有 ${countA*2 + countB*4} 隻腳。`, totalHead, totalLeg: countA*2 + countB*4, legA: 2, legB: 4, nameA: "雞", nameB: "兔子", unit: "隻腳", ans: countB };
                    },
                    () => {
                        const totalHead = rand(15, 25); const countB = rand(5, totalHead - 5); const countA = totalHead - countB;
                        return { story: `停車場有大貨車(6輪)和汽車(4輪)共 ${totalHead} 輛，共有 ${countA*4 + countB*6} 個輪子。`, totalHead, totalLeg: countA*4 + countB*6, legA: 4, legB: 6, nameA: "汽車", nameB: "大貨車", unit: "個輪子", ans: countB };
                    },
                    () => {
                        const totalHead = rand(10, 20); const countB = rand(3, totalHead - 3); const countA = totalHead - countB;
                        return { story: `奕帆買了 12元 和 5元 郵票共 ${totalHead} 張，共花了 ${countA*5 + countB*12} 元。`, totalHead, totalLeg: countA*5 + countB*12, legA: 5, legB: 12, nameA: "5元郵票", nameB: "12元郵票", unit: "元", ans: countB };
                    },
                    () => {
                        const totalHead = rand(15, 25); const countB = rand(5, totalHead - 5); const countA = totalHead - countB;
                        return { story: `媽媽買了 紅茶(30元) 和 奶茶(55元) 共 ${totalHead} 瓶，花了 ${countA*30 + countB*55} 元。`, totalHead, totalLeg: countA*30 + countB*55, legA: 30, legB: 55, nameA: "紅茶", nameB: "奶茶", unit: "元", ans: countB };
                    },
                    () => {
                        const totalHead = rand(10, 20); const countB = rand(3, totalHead - 3); const countA = totalHead - countB;
                        return { story: `貞伶買電腦，用 500元 和 1000元 鈔票付錢，共付了 ${totalHead} 張，總共 ${countA*500 + countB*1000} 元。`, totalHead, totalLeg: countA*500 + countB*1000, legA: 500, legB: 1000, nameA: "500元鈔票", nameB: "1000元鈔票", unit: "元", ans: countB };
                    }
                ]
            }
        };

        let state = {
            name: "", level: 1, score: 0, timer: 60,
            difficultyTime: 60, difficultyName: "進階",
            interval: null, isPaused: false, combo: 0,
            currentQ: null, history: [],
            questionPool: [], // 確保每輪不重複的題庫池
            investigationStep: 0, currentStepData: null,
            isAnswering: false // 防連點
        };

        const screens = {
            login: document.getElementById('screen-login'),
            select: document.getElementById('screen-level-select'),
            game: document.getElementById('screen-game'),
            result: document.getElementById('screen-result'),
            review: document.getElementById('screen-review')
        };

        function showScreen(id) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            screens[id].classList.remove('hidden');
        }

        function goHome() { window.location.href = "https://jessiemath0703-chu.github.io/website2/"; }

        function checkNameAndStart() {
            const val = document.getElementById('player-name').value.trim();
            if(!val) return alert("請輸入名字！");
            state.name = val;
            showScreen('select');
            setDifficulty(60, '進階'); // 預設進階
            renderLeaderboard();
        }

        // --- 難度設定 ---
        function setDifficulty(seconds, name) {
            state.difficultyTime = seconds;
            state.difficultyName = name;
            
            // UI 更新
            [90, 60, 45].forEach(t => {
                const btn = document.getElementById(`diff-${t}`);
                if(t === seconds) {
                    btn.className = `flex-1 text-white font-bold py-3 rounded-lg shadow-md transition border-2 ${t===90?'bg-green-500 border-green-600':t===60?'bg-blue-500 border-blue-600':'bg-red-500 border-red-600'}`;
                } else {
                    btn.className = `flex-1 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-3 rounded-lg transition border-2 border-transparent`;
                }
            });
        }

        function selectLevel(lvl) {
            state.level = lvl;
            restartGame();
        }

        // --- 遊戲核心 ---
        function restartGame() {
            state.score = 0;
            state.timer = state.difficultyTime;
            state.combo = 0;
            state.isPaused = false;
            state.history = [];
            state.questionPool = []; // 清空題庫池，重新洗牌
            state.investigationStep = 0;
            state.currentStepData = null;
            state.isAnswering = false;

            clearInterval(state.interval);
            document.getElementById('modal-pause').classList.add('hidden');

            showScreen('game');
            updateHUD();
            nextQuestion();

            state.interval = setInterval(() => {
                if(!state.isPaused) {
                    state.timer--;
                    updateHUD();
                    if(state.timer <= 0) endGame();
                }
            }, 1000);
        }

        function pauseGame() { state.isPaused = true; document.getElementById('modal-pause').classList.remove('hidden'); }
        function resumeGame() { state.isPaused = false; document.getElementById('modal-pause').classList.add('hidden'); }

        function quitGame() {
            clearInterval(state.interval);
            showScreen('select');
            renderLeaderboard();
        }

        function updateHUD() {
            document.getElementById('game-timer').innerText = state.timer;
            document.getElementById('game-score').innerText = state.score;

            const comboEl = document.getElementById('combo-display');
            if(state.combo >= 2) {
                comboEl.innerText = `Combo x${state.combo} 🔥`;
                comboEl.classList.add('show');
            } else {
                comboEl.classList.remove('show');
            }
        }

        // --- 產生下一題 (洗牌不重複) ---
        function nextQuestion() {
            state.isAnswering = false;
            const config = levels[state.level];
            const qArea = document.getElementById('question-content');
            const cArea = document.getElementById('controls-area');
            const iconArea = document.getElementById('context-illustration');
            const gameArea = document.getElementById('question-area');

            // 復原背景
            gameArea.classList.remove('bg-green-50', 'bg-red-50');
            iconArea.innerText = config.icon;

            // 如果題庫空了，重新將該關卡的工廠函式洗牌載入
            if(!state.questionPool || state.questionPool.length === 0) {
                state.questionPool = shuffle([...config.factories]);
            }

            // 特殊：雞兔問題逐步解題
            if(config.type === 'investigation') {
                if(state.investigationStep === 0) {
                    state.currentStepData = state.questionPool.pop()();
                }
                renderInvestigation(state.currentStepData, qArea, cArea);
                return;
            }

            // 一般動態出題：從洗牌後的題庫抽出一題
            const qData = state.questionPool.pop()();
            state.currentQ = qData;

            qArea.innerHTML = `<h3 class="text-2xl font-bold mb-4 text-gray-800">${qData.q}</h3>`;
            cArea.innerHTML = '';

            if(qData.type === 'choice') {
                qData.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = "opt-btn bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold py-4 px-6 rounded-xl transition text-lg w-full border-2 border-transparent";
                    btn.innerText = opt;
                    btn.onclick = () => handleChoiceAnswer(idx, qData.ans, btn, qData);
                    cArea.appendChild(btn);
                });
            } else if(qData.type === 'input') {
                cArea.innerHTML = `
                    <div class="col-span-1 md:col-span-2 flex gap-2">
                        <input type="number" id="ans-input" class="flex-grow border-2 border-gray-300 rounded-lg px-4 py-3 text-2xl text-center focus:outline-none focus:border-blue-500" placeholder="輸入數字">
                        <button id="submit-btn" class="btn-primary w-1/3 text-xl">送出</button>
                    </div>
                    <div id="input-feedback" class="col-span-1 md:col-span-2 text-center text-lg font-bold mt-2 hidden"></div>
                `;
                
                const submit = () => {
                    if(state.isAnswering) return;
                    const val = parseInt(document.getElementById('ans-input').value);
                    if(isNaN(val)) return;
                    handleInputAnswer(val, qData.ans, qData);
                };
                document.getElementById('submit-btn').onclick = submit;
                document.getElementById('ans-input').onkeypress = (e) => { if(e.key === 'Enter') submit(); };
                
                // 加一個小延遲確保 DOM 渲染完畢再 focus
                setTimeout(() => document.getElementById('ans-input').focus(), 50);
            }
        }

        // --- 雞兔問題 渲染 ---
        function renderInvestigation(data, qArea, cArea) {
            const unit = data.unit;
            const steps = [
                {
                    text: `案件：${data.story}<br>👉 第一步：先假設全部都是「${data.nameA}」！`,
                    q: `若是 ${data.totalHead} 個${data.nameA}，共有多少${unit}？`,
                    ans: data.totalHead * data.legA
                },
                {
                    text: `假設全是${data.nameA}，會有 ${data.totalHead * data.legA} ${unit}。<br>但現場實際有 ${data.totalLeg} ${unit}。<br>👉 第二步：差距是多少？`,
                    q: `總差距： ${data.totalLeg} 與 ${data.totalHead * data.legA} 相差 = ?`,
                    ans: Math.abs(data.totalLeg - (data.totalHead * data.legA))
                },
                {
                    text: `總差距是 ${Math.abs(data.totalLeg - (data.totalHead * data.legA))}。<br>👉 第三步：如果把一個${data.nameA}換成${data.nameB}，${unit}會差多少？`,
                    q: `單個差距：${data.nameB}(${data.legB}) 與 ${data.nameA}(${data.legA}) 差多少？`,
                    ans: Math.abs(data.legB - data.legA)
                },
                {
                    text: `總差距 ÷ 單個差距 = 換掉的數量。<br>👉 第四步：所以有幾個${data.nameB}？`,
                    q: `答案是？`,
                    ans: Math.abs(data.totalLeg - (data.totalHead * data.legA)) / Math.abs(data.legB - data.legA)
                }
            ];

            const current = steps[state.investigationStep];
            state.currentQ = current; // 記錄供復盤用

            qArea.innerHTML = `
                <div class="text-left w-full">
                    <div class="bg-yellow-50 p-2 rounded text-sm text-gray-500 mb-2">🕵️ ${data.story}</div>
                    <div class="step-card"><p class="font-bold text-lg">${current.text}</p></div>
                    <div class="text-center text-xl font-bold text-blue-600 mt-4">${current.q}</div>
                </div>
            `;

            cArea.innerHTML = `
                <div class="col-span-1 md:col-span-2 flex gap-2">
                    <input type="number" id="inv-input" class="flex-grow border-2 border-blue-300 rounded-lg px-4 py-3 text-xl text-center focus:outline-none">
                    <button id="inv-btn" class="btn-primary w-1/3 text-xl">送出</button>
                </div>
                <div id="input-feedback" class="col-span-1 md:col-span-2 text-center text-lg font-bold mt-2 hidden"></div>
            `;

            const submit = () => {
                if(state.isAnswering) return;
                const val = parseInt(document.getElementById('inv-input').value);
                if(isNaN(val)) return;
                handleInvestigationAnswer(val, current.ans, current, data);
            };
            document.getElementById('inv-btn').onclick = submit;
            document.getElementById('inv-input').onkeypress = (e) => { if(e.key === 'Enter') submit(); };
            setTimeout(() => document.getElementById('inv-input').focus(), 50);
        }

        // --- 答案檢查與特效 ---
        function recordHistory(qText, uAns, cAns, isCorrect) {
            state.history.push({ q: qText, userAns: uAns, correctAns: cAns, isCorrect: isCorrect });
        }

        function handleChoiceAnswer(idx, correctIdx, btnElement, qData) {
            state.isAnswering = true;
            const btns = document.querySelectorAll('.opt-btn');
            btns.forEach(b => b.disabled = true);

            const isCorrect = (idx === correctIdx);
            recordHistory(qData.q, qData.options[idx], qData.options[correctIdx], isCorrect);

            if (isCorrect) {
                btnElement.classList.add('btn-correct');
                document.getElementById('question-area').classList.add('bg-green-50');
                state.combo++;
                state.score += (100 + state.combo * 10);
            } else {
                btnElement.classList.add('btn-wrong');
                btns[correctIdx].classList.add('btn-correct');
                document.getElementById('question-area').classList.add('bg-red-50');
                state.combo = 0;
            }
            updateHUD();
            setTimeout(nextQuestion, 1200);
        }

        function handleInputAnswer(val, correctAns, qData) {
            state.isAnswering = true;
            document.getElementById('ans-input').disabled = true;
            document.getElementById('submit-btn').disabled = true;
            
            const isCorrect = (val === correctAns);
            recordHistory(qData.q, val, correctAns, isCorrect);
            
            const fb = document.getElementById('input-feedback');
            fb.classList.remove('hidden');

            if (isCorrect) {
                document.getElementById('ans-input').classList.add('border-green-500', 'bg-green-50', 'text-green-700');
                document.getElementById('question-area').classList.add('bg-green-50');
                fb.innerHTML = `✅ 答對了！`; fb.classList.add('text-green-600');
                state.combo++;
                state.score += (100 + state.combo * 10);
            } else {
                document.getElementById('ans-input').classList.add('border-red-500', 'bg-red-50', 'text-red-700');
                document.getElementById('question-area').classList.add('bg-red-50');
                fb.innerHTML = `❌ 答錯囉！正確答案是 <span class="text-blue-600">${correctAns}</span>`; fb.classList.add('text-red-500');
                state.combo = 0;
            }
            updateHUD();
            setTimeout(nextQuestion, 1500);
        }

        function handleInvestigationAnswer(val, correctAns, currentStep, fullData) {
            state.isAnswering = true;
            document.getElementById('inv-input').disabled = true;
            document.getElementById('inv-btn').disabled = true;
            
            const isCorrect = (val === correctAns);
            recordHistory(currentStep.text.replace(/<br>/g, ' ') + " " + currentStep.q, val, correctAns, isCorrect);
            
            const fb = document.getElementById('input-feedback');
            fb.classList.remove('hidden');

            if(isCorrect) {
                document.getElementById('inv-input').classList.add('border-green-500', 'bg-green-50');
                document.getElementById('question-area').classList.add('bg-green-50');
                fb.innerHTML = `✅ 正確！前往下一步`; fb.classList.add('text-green-600');
                state.investigationStep++;
                state.score += 30; // 步驟分
                state.combo++;
                updateHUD();

                setTimeout(() => {
                    if(state.investigationStep >= 4) {
                        state.score += 50; // 完賽獎勵
                        state.investigationStep = 0;
                        nextQuestion(); // 換下一題大題
                    } else {
                        state.isAnswering = false;
                        renderInvestigation(fullData, document.getElementById('question-content'), document.getElementById('controls-area'));
                        document.getElementById('question-area').classList.remove('bg-green-50');
                    }
                }, 1200);

            } else {
                document.getElementById('inv-input').classList.add('border-red-500', 'bg-red-50');
                document.getElementById('question-area').classList.add('bg-red-50');
                fb.innerHTML = `❌ 算錯囉！正確是 <span class="text-blue-600">${correctAns}</span>`; fb.classList.add('text-red-500');
                state.combo = 0;
                updateHUD();

                setTimeout(() => {
                    // 答錯也繼續下一步驟
                    state.investigationStep++;
                    if(state.investigationStep >= 4) {
                        state.investigationStep = 0;
                        nextQuestion();
                    } else {
                        state.isAnswering = false;
                        renderInvestigation(fullData, document.getElementById('question-content'), document.getElementById('controls-area'));
                        document.getElementById('question-area').classList.remove('bg-red-50');
                    }
                }, 1800);
            }
        }

        // --- 遊戲結束與排行榜 ---
        function endGame() {
            clearInterval(state.interval);
            showScreen('result');
            document.getElementById('result-score').innerText = state.score;

            // 星級計算 (隨難度不同標準)
            const targetScore = state.difficultyTime === 90 ? 800 : (state.difficultyTime === 60 ? 600 : 500);
            let stars = 1;
            if(state.score >= targetScore) stars = 2;
            if(state.score >= targetScore * 1.5) stars = 3;

            const starContainer = document.getElementById('result-stars');
            starContainer.innerHTML = '';
            for(let i=0; i<3; i++) {
                const s = document.createElement('i');
                s.className = `fa-solid fa-star star ${i < stars ? 'filled' : ''}`;
                starContainer.appendChild(s);
            }

            saveScore();
            buildReviewList();
        }

        function saveScore() {
            const key = "jessie_math_lb_v2";
            let lb = JSON.parse(localStorage.getItem(key) || "[]");
            lb.push({ 
                name: state.name, 
                score: state.score, 
                level: levels[state.level].name, 
                mode: state.difficultyName,
                time: state.difficultyTime 
            });
            lb.sort((a,b) => b.score - a.score);
            localStorage.setItem(key, JSON.stringify(lb.slice(0, 10))); // 留存前 10 名
        }

        function renderLeaderboard() {
            const key = "jessie_math_lb_v2";
            let lb = JSON.parse(localStorage.getItem(key) || "[]");

            const list = document.getElementById('select-screen-lb-list');
            if(lb.length === 0) {
                list.innerHTML = `<div class="col-span-full text-gray-400 text-center py-6">目前尚無英雄紀錄，快來搶下第一名！</div>`;
                return;
            }

            const getMedal = (index) => {
                if(index === 0) return '🥇';
                if(index === 1) return '🥈';
                if(index === 2) return '🥉';
                return '🎖️';
            };

            list.innerHTML = lb.map((p, i) => `
                <div class="flex justify-between items-center p-3 border rounded-lg bg-gray-50 hover:bg-orange-50 transition border-gray-100">
                    <div class="flex items-center gap-3">
                        <span class="text-2xl w-8 text-center">${getMedal(i)}</span>
                        <div>
                            <div class="font-bold text-gray-800">${p.name}</div>
                            <div class="text-xs text-gray-500">${p.level} • ${p.mode}</div>
                        </div>
                    </div>
                    <div class="font-black text-orange-500 text-lg">${p.score}</div>
                </div>
            `).join('');
        }

        // --- 建立復盤清單 ---
        function buildReviewList() {
            const list = document.getElementById('review-list');
            if(state.history.length === 0) {
                list.innerHTML = '<div class="text-center text-gray-500 py-4">沒有答題紀錄。</div>';
                return;
            }

            list.innerHTML = state.history.map((h, i) => `
                <div class="p-4 rounded-xl border-l-4 ${h.isCorrect ? 'border-green-500 bg-green-50' : 'border-red-500 bg-red-50'}">
                    <div class="font-bold text-gray-800 mb-2 text-sm"><span class="text-gray-500 mr-1">Q${i+1}.</span> ${h.q}</div>
                    <div class="flex flex-col sm:flex-row gap-2 text-sm">
                        <div class="${h.isCorrect ? 'text-green-700' : 'text-red-700'} font-semibold">你的答案：${h.userAns} ${h.isCorrect ? '✅' : '❌'}</div>
                        ${!h.isCorrect ? `<div class="text-blue-700 font-semibold sm:ml-4">正確答案：${h.correctAns}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
